---
# tasks file for ./roles/irmc_set_certificate
- name: Set iRMC certificates
  fsas.primergy.irmc_certificate:
    irmc_url: "{{ inventory_hostname }}"
    irmc_username: "{{ irmc_user }}"
    irmc_password: "{{ irmc_password }}"
    validate_certs: "{{ validate_certificate }}"
    command: set
    private_key_path: "{{ ssl_private_key_path }}"
    ssl_cert_path: "{{ ssl_cert_path }}"
    ssl_ca_cert_path: "{{ ssl_ca_cert_path }}"
  delegate_to: localhost
  register: set_result

# 登録した証明書は iRMC を再起動するまで使われないため、変更があったときだけ再起動する
# ハンドラにはしない。ハンドラだと再起動がプレイの最後まで遅れ、後続のタスクが再起動前の iRMC に対して走るため
# 証明書の登録後に再起動が失敗すると、やり直しても証明書は登録済み(changed=False)で再起動されない。
# iRMC からは「登録済みだが未反映」を判別できないので、その場合は force_reboot: true で再起動させる
- name: Reboot iRMC and wait until it is back # noqa: no-handler
  when: set_result.changed or (force_reboot | default(irmc_set_certificate_force_reboot) | bool)
  block:
    - name: Reboot iRMC
      ansible.builtin.uri:
        url: https://{{ inventory_hostname }}/redfish/v1/Managers/iRMC/Actions/Manager.Reset
        method: POST
        url_username: "{{ irmc_user }}"
        url_password: "{{ irmc_password }}"
        validate_certs: "{{ validate_certificate }}"
        # Accept が無いと iRMC は 406 (AcceptNotSupported) を返す
        headers:
          Accept: application/json
        body: {}
        body_format: json
        status_code: 204
        force_basic_auth: true
        use_proxy: false

    # 再起動が始まるまでにヘルスチェックを行うと200が返ってきて終了してしまうのでしばらく待つ
    - name: Pause until start of iRMC reboot
      ansible.builtin.pause:
        seconds: 60

    - name: Define wait parameters
      ansible.builtin.set_fact:
        sec_between_retry: 15 # 各リトライ間の待機時間（秒）
        sec_request_timeout: 10 # 1回のヘルスチェックの応答待ちの上限（秒）。再起動中は応答待ちで長く止まることがあるため

    - name: Set non-default seconds if sec_until_timeout is defined
      ansible.builtin.set_fact:
        irmc_set_certificate_sec_until_timeout: "{{ sec_until_timeout }}"
      when: sec_until_timeout is defined

    # 1回のリトライは最大で「応答待ちの上限 + 待機時間」かかるので、それを基に回数を決めて全体の上限を守る
    - name: Define maximum number of retries
      ansible.builtin.set_fact:
        max_retries: "{{ (irmc_set_certificate_sec_until_timeout | int) // (sec_between_retry + sec_request_timeout) }}"

    - name: Health check to iRMC
      ansible.builtin.uri:
        url: https://{{ inventory_hostname }}/redfish/v1/Managers/iRMC
        method: GET
        url_username: "{{ irmc_user }}"
        url_password: "{{ irmc_password }}"
        validate_certs: "{{ validate_certificate }}"
        headers:
          Accept: application/json
        timeout: "{{ sec_request_timeout }}"
        force_basic_auth: true
        use_proxy: false
      register: response
      until: response.status == 200
      retries: "{{ max_retries }}"
      delay: "{{ sec_between_retry }}"
